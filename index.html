<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cardápio</title>
<meta name="theme-color" content="#0f0d0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg?v=8" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=8">
<style>
.hero{position:relative;padding:18px 0 16px;background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--brand) 30%,transparent),transparent 60%),var(--bg)}
.hrow{display:flex;gap:14px;align-items:center}
.logo{width:68px;height:68px;border-radius:18px;background:var(--card2);border:2px solid var(--brand);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;font-size:1.6rem;color:var(--brand)}
.logo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.hero .sl{color:var(--muted);font-size:.88rem;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:99px;margin-top:8px;background:rgba(47,191,107,.14);color:#4fe08b}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.off{background:rgba(255,91,77,.14);color:#ff8074}
.info{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.info span{font-size:.78rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 10px}
.aviso{margin-top:12px;background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:#ffd27a;border-radius:13px;padding:10px 12px;font-size:.86rem;font-weight:600}
.banner{margin-top:14px;border-radius:var(--r);padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 40%,#000),color-mix(in srgb,var(--brand) 10%,#000));border:1px solid color-mix(in srgb,var(--brand) 50%,transparent)}
.banner b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:#fff;opacity:.9}
.banner p{font-weight:600;margin-top:3px}
.repeat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.repeat b{display:block}.repeat small{color:var(--muted);font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.repeat .go{margin-left:auto;background:var(--brand);color:#fff;font-weight:700;padding:8px 12px;border-radius:10px;font-size:.85rem;flex:none}
.search{margin-top:14px;position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.cats{position:sticky;top:0;z-index:20;background:rgba(15,13,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cat{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.86rem;color:var(--muted)}
.cat.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sec h2{font-size:1.1rem;font-weight:800;margin:22px 0 8px;scroll-margin-top:64px}
.prod{display:flex;gap:12px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.prod .tx{flex:1;min-width:0}
.prod b{display:block;font-size:1rem;font-weight:700}
.prod p{color:var(--muted);font-size:.84rem;margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .pr{font-weight:700}
.prod .pr small{color:var(--muted);font-weight:500;font-size:.78rem}
.prod .ph{width:92px;height:92px;border-radius:14px;flex:none;position:relative}
.tag{position:absolute;left:5px;top:5px;background:var(--brand);color:#fff;font-size:.62rem;font-weight:800;padding:3px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.02em;max-width:82px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod.off{opacity:.45}
.esg{color:var(--bad);font-size:.78rem;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.foot{text-align:center;color:var(--muted);font-size:.78rem;padding:30px 0 120px}
.foot a{color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(12px + env(safe-area-inset-bottom));transform:translateY(130%);transition:transform .25s}
.bar.show{transform:none}
.bar button{max-width:568px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;background:var(--brand);color:#fff;padding:14px 16px;border-radius:16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.bar .q{background:rgba(0,0,0,.22);border-radius:9px;padding:3px 9px;font-size:.85rem}
.bar .t{margin-left:auto}
/* produto aberto */
.big{height:230px;position:relative}
.big .ph{height:100%}
.pd h3{font-size:1.35rem;font-weight:800;margin-top:14px}
.pd .ds{color:var(--muted);font-size:.92rem;margin-top:4px}
.pd .bp{font-weight:800;font-size:1.1rem;margin-top:8px}
.grp{margin-top:18px}
.gh{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px}
.gh b{flex:1;font-size:.95rem}
.gh small{color:var(--muted);font-size:.75rem;display:block;font-weight:500}
.req{font-size:.68rem;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--card2);color:var(--muted);text-transform:uppercase}
.req.need{background:var(--brand);color:#fff}
.opt{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.opt span{flex:1}
.opt em{font-style:normal;color:var(--muted);font-size:.88rem}
.box{width:22px;height:22px;border-radius:7px;border:2px solid #5a514a;flex:none;display:grid;place-items:center}
.box.r{border-radius:50%}
.opt.on .box{background:var(--brand);border-color:var(--brand)}
.opt.on .box::after{content:"";width:8px;height:8px;border-radius:2px;background:#fff}
.opt.on .box.r::after{border-radius:50%}
.opt.dis{opacity:.35}
.prod .ph .add{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-size:1.35rem;font-weight:700;line-height:30px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.xstick{position:sticky;top:0;height:0;z-index:6}
.xstick .x{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(4px)}
.opt{background:var(--card);border:1px solid var(--line)!important;border-radius:14px;padding:13px 12px!important;margin-top:8px;transition:border-color .15s}
.opt.on{border-color:var(--brand)!important}
.box{border-color:#8a7f76!important}
.box.c{border-radius:50%;width:26px;height:26px}
.box.c::before{content:"+";color:#bdb3aa;font-weight:700;font-size:1.05rem;line-height:1}
.opt.on .box.c::before{content:"✓";color:#fff;font-size:.9rem}
.opt.on .box.c::after{display:none}

.qty{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:13px;padding:4px}
.qty button{width:38px;height:38px;border-radius:10px;font-size:1.3rem;font-weight:700}
.qty span{min-width:22px;text-align:center;font-weight:800}
.addrow{display:flex;gap:10px;align-items:center}
.addrow .btn{flex:1}
/* sacola */
.it{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.it .tx{flex:1;min-width:0}
.it b{display:block;font-size:.95rem}
.it small{display:block;color:var(--muted);font-size:.8rem}
.it .qty{align-self:center;padding:2px}
.it .qty button{width:30px;height:30px;font-size:1.1rem}
.cup{display:flex;gap:8px}
.cup .i{text-transform:uppercase}
.okmsg{color:#4fe08b;font-size:.85rem;font-weight:600;margin-top:6px}
.choices{display:grid;gap:8px}
.ch{display:flex;align-items:center;gap:10px;padding:13px;border-radius:13px;background:var(--bg2);border:1.5px solid var(--line);font-weight:600;text-align:left;width:100%}
.ch small{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.ch.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--bg2))}
.done{text-align:center;padding:30px 4px 10px}
.done .ck{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok);display:grid;place-items:center;margin:0 auto;font-size:2rem}
.done h3{font-size:1.4rem;margin-top:14px}
.setup{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}
.capa{height:170px;position:relative;background:var(--card2) center/cover no-repeat}
.capa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,13,12,.15),rgba(15,13,12,.55) 60%,var(--bg))}
.hero.comcapa{padding-top:0;margin-top:-58px;position:relative;z-index:2;background:none}
.minhas{position:absolute;top:calc(12px + env(safe-area-inset-top));right:max(14px, env(safe-area-inset-right));z-index:5;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-weight:700;font-size:.8rem;padding:8px 12px;border-radius:99px}
.slides{margin-top:14px;position:relative}
.strack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;border-radius:var(--r)}
.strack::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:16/8;max-width:100%;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 55%,#000),color-mix(in srgb,var(--brand) 15%,#000));text-align:left}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .sx{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.slide b{display:block;font-size:1.15rem;font-weight:800;color:#fff;line-height:1.2}
.slide span{display:block;color:#f1e6dc;font-size:.86rem;margin-top:2px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:.2s}
.dots i.on{width:18px;background:var(--brand)}
.trk{margin-top:16px}
.st{display:flex;gap:12px;position:relative;padding-bottom:18px}
.st:last-child{padding-bottom:0}
.st .d{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);background:var(--bg);flex:none;display:grid;place-items:center;font-size:.75rem;position:relative;z-index:1}
.st:not(:last-child)::after{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2.5px;background:var(--line)}
.st.ok .d{background:var(--ok);border-color:var(--ok);color:#fff}
.st.ok:not(:last-child)::after{background:var(--ok)}
.st.cur .d{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--brand) 25%,transparent)}
.st b{display:block;font-size:.98rem}.st small{color:var(--muted);font-size:.8rem}
.st:not(.ok):not(.cur) b{color:var(--muted)}
.big-st{font-size:1.5rem;font-weight:800;margin-top:4px}
.mp{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.load{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.fab{position:fixed;right:max(16px, env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:29;width:56px;height:56px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:bottom .25s}
.fab svg{width:26px;height:26px;color:var(--brand)}
body.combarra .fab{bottom:calc(86px + env(safe-area-inset-bottom))}
.chat{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:.93rem;white-space:pre-line;line-height:1.4}
.msg.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.eu{background:var(--brand);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.qb{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:92%}
.qb button{padding:8px 12px;border-radius:99px;border:1px solid color-mix(in srgb,var(--brand) 55%,transparent);color:var(--ink);font-size:.84rem;font-weight:600;background:color-mix(in srgb,var(--brand) 10%,transparent)}
.chatin{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.chatin .btn{padding:12px 16px}
.dig{display:inline-flex;gap:4px}.dig i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pul 1s infinite}.dig i:nth-child(2){animation-delay:.15s}.dig i:nth-child(3){animation-delay:.3s}
@keyframes pul{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div id="root"></div>

<!-- telas -->
<div class="sheet" id="shProd"><div class="panel tall" id="pnProd"></div></div>
<div class="sheet" id="shCart"><div class="panel tall" id="pnCart"></div></div>
<div class="sheet" id="shCheck"><div class="panel tall" id="pnCheck"></div></div>
<div class="sheet" id="shDone"><div class="panel tall" id="pnDone"></div></div>
<div class="bar" id="bar"><button id="barBtn"><span class="q" id="barQ"></span><span>Ver sacola</span><span class="t" id="barT"></span></button></div>
<div class="sheet" id="shChat"><div class="panel tall" id="pnChat" style="display:flex;flex-direction:column"></div></div>
<button class="fab hidden" id="fab" aria-label="Tirar dúvidas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.2-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01" stroke-width="3" stroke-linecap="round"/></svg></button>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>window.APP_PAGE = "cardapio";</script>
<script src="config.js?v=8"></script>
<script src="art.js?v=8"></script>
<script src="store.js?v=8"></script>
<script src="atendente.js?v=8"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
let D = null;                 // dados da loja
let cart = [];                // [{key, pid, nome, qtd, unit, escolhas, opcoesTxt, obs}]
let cupomAtivo = null;
let check = { tipo: null, pag: null, agendar: "" };

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), 2600); }
function abrir(id) { $("#" + id).classList.add("open"); document.body.style.overflow = "hidden"; }
function fechar(id) { $("#" + id).classList.remove("open"); if (!document.querySelector(".sheet.open")) document.body.style.overflow = ""; }
document.querySelectorAll(".sheet").forEach((s) => s.addEventListener("click", (e) => { if (e.target === s) fechar(s.id); }));
try { cart = JSON.parse(sessionStorage.getItem("cart_" + Store.id) || "[]"); } catch (e) {}
function salvarCart() { try { sessionStorage.setItem("cart_" + Store.id, JSON.stringify(cart)); } catch (e) {} renderBar(); }

// ================= TELA PRINCIPAL =================
function render() {
  D = Store.get();
  if (Store.nuvem && (!Store.lojaExiste() || !Store.situacao().ativa)) {
    document.title = D ? D.loja.nome : "Cardápio";
    $("#root").innerHTML = `<div class="setup"><div><img src="icon.svg?v=8" alt="" width="64" height="64" style="border-radius:18px;display:block;margin:0 auto"><h2 style="margin-top:16px">${!Store.lojaExiste() ? "Loja não encontrada" : esc(D.loja.nome)}</h2><p class="muted" style="margin-top:6px">${!Store.lojaExiste() ? "Confira se o link está certo." : "O cardápio está temporariamente fora do ar."}</p>${Store.lojaExiste() && D && D.loja.whats ? `<a class="btn green" style="margin-top:20px" href="https://wa.me/${waNum(D.loja.whats)}" target="_blank" rel="noopener">Pedir pelo WhatsApp</a>` : ""}</div></div>`;
    $("#fab").classList.add("hidden"); renderBar(); return;
  }
  if (!D) {
    document.title = "Cardápio";
    $("#root").innerHTML = `<div class="setup"><div><img src="icon.svg?v=8" alt="" width="64" height="64" style="border-radius:18px;display:block;margin:0 auto"><h2 style="margin-top:16px">Cardápio em breve</h2><p class="muted" style="margin-top:6px">Esta loja ainda está montando o cardápio. Volte daqui a pouco!</p></div></div>`;
    return;
  }
  const L = D.loja, st = statusLoja(L);
  aplicarCor(L.cor);
  document.title = L.nome + " · Cardápio";
  const prods = D.produtos;
  const cl = Store.cliente();
  const ult = (cl && cl.ultimo || []).filter((u) => prods.find((p) => p.id === u.pid && p.ativo));
  const q = (window._busca || "").trim().toLowerCase();
  const secs = D.categorias.map((c) => {
    const ps = prods.filter((p) => p.cat === c.id && (!q || (p.nome + " " + p.desc).toLowerCase().includes(q)));
    if (!ps.length) return "";
    return `<section class="sec" id="c_${c.id}"><h2>${esc(c.nome)}</h2>${ps.map(cardProd).join("")}</section>`;
  }).join("");
  const logo = Store.img(L.logo), capa = Store.img(L.capa), meus = Store.meusPedidos();
  const slides = PRO() ? (L.slides || []).filter((x) => Store.img(x.img) || x.titulo) : [];
  $("#root").innerHTML = `
  ${meus.length ? `<button class="minhas" id="btnMeus">📦 Meus pedidos</button>` : ""}
  ${capa && PRO() ? `<div class="capa" style="background-image:url('${capa}')"></div>` : ""}
  <header class="hero ${capa && PRO() ? "comcapa" : ""}"><div class="wrap">
    <div class="hrow">
      <div class="logo">${logo ? `<img src="${logo}" alt="">` : esc(L.nome.charAt(0))}</div>
      <div style="min-width:0"><h1>${esc(L.nome)}</h1>${L.slogan ? `<div class="sl">${esc(L.slogan)}</div>` : ""}
        <span class="pill ${st.aberta ? "" : "off"}"><i></i>${esc(st.texto)}</span></div>
    </div>
    <div class="info">
      ${L.entrega ? `<span>🛵 Entrega ${esc(L.tempoEntrega)}</span>` : ""}
      ${L.retirada ? `<span>🏪 Retirada ${esc(L.tempoRetirada)}</span>` : ""}
      ${L.pedidoMinimo > 0 ? `<span>Pedido mínimo ${brl(L.pedidoMinimo)}</span>` : ""}
      ${L.endereco ? `<span>📍 ${esc(L.endereco)}</span>` : ""}
    </div>
    ${L.aviso ? `<div class="aviso">📢 ${esc(L.aviso)}</div>` : ""}
    ${!st.aberta && L.agendamento ? `<div class="aviso">Estamos fechados agora, mas você já pode deixar seu pedido agendado.</div>` : ""}
    ${slides.length ? `<div class="slides"><div class="strack" id="strack">${slides.map((x) => { const im = Store.img(x.img); return `<button class="slide" ${x.pid ? `data-p="${x.pid}"` : ""}>${im ? `<img src="${im}" alt="">` : ""}${x.titulo || x.texto ? `<div class="sx"><b>${esc(x.titulo)}</b>${x.texto ? `<span>${esc(x.texto)}</span>` : ""}</div>` : ""}</button>`; }).join("")}</div>${slides.length > 1 ? `<div class="dots" id="dots">${slides.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}</div>` : ""}
    ${L.banner && L.banner.ativo && (L.banner.titulo || L.banner.texto) ? `<div class="banner"><b>🔥 ${esc(L.banner.titulo)}</b><p>${esc(L.banner.texto)}</p></div>` : ""}
    ${ult.length ? `<button class="repeat" id="btnRep"><div style="min-width:0"><b>Pedir de novo?</b><small>${ult.map((u) => `${u.qtd}x ${esc(u.nome)}`).join(" + ")}</small></div><span class="go">Repetir</span></button>` : ""}
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

  if (!c) { el.innerHTML = `<p class="err">Cupom inválido ou expirado.</p>`; cupomAtivo = null; return; }
  if (s < c.minimo) { el.innerHTML = `<p class="err">Esse cupom vale para pedidos a partir de ${brl(c.minimo)}.</p>`; return; }
  el.innerHTML = `<p class="okmsg">✓ Cupom aplicado: ${c.tipo === "pct" ? c.valor + "% de desconto" : brl(c.valor) + " de desconto"}</p>`;
  if (feedback) toast("Cupom aplicado!");
}

// ================= FINALIZAR =================
function abrirCheckout() {
  const L = D.loja, st = statusLoja(L);
  if (!st.aberta && !L.agendamento) { toast("A loja está fechada agora"); return; }
  if (!check.tipo) check.tipo = L.entrega ? "entrega" : L.retirada ? "retirada" : "local";
  const pags = [L.pix && "Pix", L.dinheiro && "Dinheiro", L.cartao && "Cartão na entrega"].filter(Boolean);
  if (!check.pag || !pags.includes(check.pag)) check.pag = pags[0];
  const cl = Store.cliente() || {};
  const horas = !st.aberta ? horariosAgendar(L) : [];
  const fmtH = (t) => t.toLocaleString("pt-BR", { weekday: "short", hour: "2-digit", minute: "2-digit" }).replace(".", "");
  $("#pnCheck").innerHTML = `<div class="phead"><button class="x" data-x="shCheck">←</button><h3>Finalizar pedido</h3></div>
  <div class="pbody">
    <label class="f">Seu nome</label><input class="i" id="cNome" autocomplete="name" value="${esc(cl.nome || "")}" placeholder="Como te chamamos?">
    <label class="f">Seu WhatsApp</label><input class="i" id="cWhats" inputmode="tel" autocomplete="tel" value="${esc(cl.whats || "")}" placeholder="(00) 9 0000-0000">
    <label class="f">Como você quer receber?</label>
    <div class="seg" id="segTipo">${[L.entrega && ["entrega", "🛵 Entrega"], L.retirada && ["retirada", "🏪 Retirar"], L.consumoLocal && ["local", "🍽️ No local"]].filter(Boolean).map(([v, t]) => `<button data-tipo="${v}" class="${check.tipo === v ? "on" : ""}">${t}</button>`).join("")}</div>
    <div id="boxEnd" class="${check.tipo === "entrega" ? "" : "hidden"}">
      ${L.tipoTaxa === "bairro" ? `<label class="f">Bairro</label><select class="i" id="cBairro"><option value="">Selecione o bairro</option>${L.taxas.map((t, i) => `<option value="${i}" ${cl.bairro === t.bairro ? "selected" : ""}>${esc(t.bairro)} · ${t.valor > 0 ? brl(t.valor) : "grátis"}</option>`).join("")}</select>`
        : `<label class="f">Bairro</label><input class="i" id="cBairroTx" value="${esc(cl.bairro || "")}" placeholder="Seu bairro">`}
      <label class="f">Rua e número</label><input class="i" id="cEnd" autocomplete="street-address" value="${esc(cl.end || "")}" placeholder="Ex.: Rua Sete, 120">
      <label class="f">Complemento / referência</label><input class="i" id="cRef" value="${esc(cl.ref || "")}" placeholder="Opcional">
    </div>
    <div id="boxMesa" class="${check.tipo === "local" ? "" : "hidden"}"><label class="f">Mesa ou referência</label><input class="i" id="cMesa" placeholder="Ex.: mesa 4"></div>
    ${!st.aberta ? `<label class="f">Agendar para</label><select class="i" id="cAg">${horas.map((t) => `<option value="${t.getTime()}">${fmtH(t)}</option>`).join("") || `<option value="">Sem horários disponíveis</option>`}</select>` : ""}
    <label class="f">Pagamento</label>
    <div class="choices" id="pags">${pags.map((p) => `<button class="ch ${check.pag === p ? "on" : ""}" data-pag="${p}"><span style="flex:1">${p}${p === "Pix" && L.chavePix ? `<small>A chave vai junto na mensagem</small>` : ""}</span></button>`).join("")}</div>
    <div id="boxTroco" class="${check.pag === "Dinheiro" ? "" : "hidden"}"><label class="f">Troco para quanto?</label><input class="i" id="cTroco" inputmode="decimal" placeholder="Deixe vazio se não precisar"></div>
    <div class="card" id="resumoCk"></div>
    <p class="err hidden" id="ckErr"></p>
  </div>
  <div class="pfoot"><button class="btn full green" id="enviar">Enviar pedido pelo WhatsApp</button></div>`;
  $("#segTipo").querySelectorAll("[data-tipo]").forEach((b) => b.onclick = () => { check.tipo = b.dataset.tipo; $("#segTipo").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); $("#boxEnd").classList.toggle("hidden", check.tipo !== "entrega"); $("#boxMesa").classList.toggle("hidden", check.tipo !== "local"); resumoCk(); });
  $("#pags").querySelectorAll("[data-pag]").forEach((b) => b.onclick = () => { check.pag = b.dataset.pag; $("#pags").querySelectorAll(".ch").forEach((x) => x.classList.toggle("on", x === b)); $("#boxTroco").classList.toggle("hidden", check.pag !== "Dinheiro"); });
  if ($("#cBairro")) $("#cBairro").onchange = resumoCk;
  $("#enviar").onclick = enviar;
  resumoCk(); abrir("shCheck"); $("#pnCheck").scrollTop = 0;
}
function taxaAtual() {
  const L = D.loja; if (check.tipo !== "entrega") return 0;
  if (L.tipoTaxa === "fixa") return Number(L.taxaFixa) || 0;
  const i = $("#cBairro") && $("#cBairro").value; return i === "" || i == null ? null : Number(L.taxas[+i].valor) || 0;
}
function resumoCk() {
  const s = sub(), d = calcDesconto(s), t = taxaAtual();
  $("#resumoCk").innerHTML = `<div class="line"><span>Subtotal</span><span>${brl(s)}</span></div>
    ${d ? `<div class="line" style="color:#4fe08b"><span>Desconto</span><span>− ${brl(d)}</span></div>` : ""}
    ${check.tipo === "entrega" ? `<div class="line"><span>Entrega</span><span>${t == null ? "escolha o bairro" : t ? brl(t) : "Grátis"}</span></div>` : ""}
    <div class="line tot"><span>Total</span><span>${brl(s - d + (t || 0))}</span></div>`;
}
function enviar() {
  const L = D.loja, v = (id) => ($(id) ? $(id).value.trim() : "");
  const err = (m) => { $("#ckErr").textContent = m; $("#ckErr").classList.remove("hidden"); $("#ckErr").scrollIntoView({ behavior: "smooth", block: "center" }); };
  const nome = v("#cNome"), whats = soDig(v("#cWhats"));
  if (!nome) return err("Coloque seu nome.");
  if (whats.length < 10) return err("Coloque um WhatsApp válido com DDD.");
  const s = sub(), d = calcDesconto(s), taxa = taxaAtual();
  let bairro = "", end = "", ref = "";
  if (check.tipo === "entrega") {
    bairro = L.tipoTaxa === "bairro" ? ($("#cBairro").value !== "" ? L.taxas[+$("#cBairro").value].bairro : "") : v("#cBairroTx");
    end = v("#cEnd"); ref = v("#cRef");
    if (!bairro) return err("Escolha o bairro.");
    if (!end) return err("Coloque a rua e o número.");
    if (L.pedidoMinimo > 0 && s < L.pedidoMinimo) return err(`O pedido mínimo para entrega é ${brl(L.pedidoMinimo)}.`);
  }
  const total = s - d + (taxa || 0);
  let troco = "";
  if (check.pag === "Dinheiro" && v("#cTroco")) { const tv = num(v("#cTroco")); if (tv <= total) return err(`O troco precisa ser para um valor maior que ${brl(total)}.`); troco = tv; }
  const st = statusLoja(L);
  let agendado = null;
  if (!st.aberta) { const a = v("#cAg"); if (!a) return err("Não há horário disponível para agendar."); agendado = +a; }
  const ped = Store.addPedido({
    nome, whats, tipo: check.tipo, bairro, end, ref, mesa: v("#cMesa"), pag: check.pag, troco, agendado,
    itens: cart.map((c) => ({ pid: c.pid, nome: c.nome, qtd: c.qtd, unit: c.unit, opcoes: c.opcoes, obs: c.obs })),
    subtotal: s, desconto: d, cupom: d ? cupomAtivo : "", taxa: taxa || 0, total
  });
  Store.setCliente({ nome, whats: v("#cWhats"), bairro, end, ref, ultimo: cart.map((c) => ({ pid: c.pid, nome: c.nome, qtd: c.qtd, escolhas: c.escolhas, obs: c.obs })) });
  const link = `https://wa.me/${waNum(L.whats)}?text=${encodeURIComponent(mensagem(ped))}`;
  cart = []; cupomAtivo = null; salvarCart();
  Store.addMeuPedido(ped.id);
  fechar("shCheck"); fechar("shCart");
  render(); abrirAcompanhar(ped.id, link);
  setTimeout(() => { try { window.open(link, "_blank"); } catch (e) {} }, 300);
}
function mensagem(p) {
  const L = D.loja, l = [];
  if (L.msgCabecalho) l.push(L.msgCabecalho, "");
  l.push(`*PEDIDO #${p.num}* — ${L.nome}`);
  if (p.agendado) l.push(`🕒 *Agendado para:* ${new Date(p.agendado).toLocaleString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}`);
  l.push("");
  p.itens.forEach((i) => { l.push(`▪️ *${i.qtd}x ${i.nome}* — ${brl(i.unit * i.qtd)}`); if (i.opcoes.length) l.push(`   ${i.opcoes.join(", ")}`); if (i.obs) l.push(`   Obs: ${i.obs}`); });
  l.push("", `Subtotal: ${brl(p.subtotal)}`);
  if (p.desconto) l.push(`Desconto (${p.cupom}): -${brl(p.desconto)}`);
  if (p.tipo === "entrega") l.push(`Entrega: ${p.taxa ? brl(p.taxa) : "grátis"}`);
  l.push(`*Total: ${brl(p.total)}*`, "");
  l.push(`👤 ${p.nome} · ${fone(p.whats)}`);
  if (p.tipo === "entrega") l.push(`🛵 *Entrega:* ${p.end} — ${p.bairro}${p.ref ? ` (${p.ref})` : ""}`);
  else if (p.tipo === "retirada") l.push(`🏪 *Vou retirar no local*`);
  else l.push(`🍽️ *Consumo no local*${p.mesa ? ` — ${p.mesa}` : ""}`);
  l.push(`💳 *Pagamento:* ${p.pag}${p.troco ? ` (troco para ${brl(p.troco)})` : ""}`);
  if (p.pag === "Pix" && L.chavePix) l.push(`Chave Pix: ${L.chavePix}${L.nomePix ? ` (${L.nomePix})` : ""}`);
  if (L.msgRodape) l.push("", L.msgRodape);
  return l.join("\n");
}

$("#root").innerHTML = `<div class="load">Carregando cardápio…</div>`;
Store.onErro((m) => toast(m));
Store.ready(() => {
  if (!Store.nuvem) window.montarDemo();
  render();
  Store.onChange(() => { const open = document.querySelector(".sheet.open"); if (!open) render(); else D = Store.get(); });
});
</script>
</body>
