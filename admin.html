<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel da loja</title>
<meta name="theme-color" content="#0f0d0c">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest-admin.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
body{background:#0c0a09}
.top{position:sticky;top:0;z-index:20;background:rgba(12,10,9,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:12px}
.top h1{font-size:1.02rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-size:.74rem;color:var(--muted);font-weight:600}
.stbtn{margin-left:auto;display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:.8rem;font-weight:700;flex:none}
.stbtn i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stbtn.off i{background:var(--bad)}
main.wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#141110;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:.7rem;font-weight:600;color:var(--muted);position:relative}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--brand)}
.nav em{position:absolute;top:4px;left:calc(50% + 6px);background:var(--brand);color:#fff;font-style:normal;font-size:.65rem;font-weight:800;border-radius:99px;padding:1px 6px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.82rem;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip em{font-style:normal;background:rgba(0,0,0,.25);border-radius:99px;padding:0 6px;margin-left:5px}
.ord{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.ord.novo{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.oh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oh b{font-size:1.1rem}
.oh small{color:var(--muted);font-size:.78rem}
.oh .badge{margin-left:auto}
.s-novo{background:color-mix(in srgb,var(--brand) 22%,transparent);color:#ffb08f}
.s-preparo{background:rgba(255,176,32,.16);color:#ffcc66}
.s-saiu,.s-pronto{background:rgba(64,156,255,.16);color:#8cc4ff}
.s-entregue{background:rgba(47,191,107,.16);color:#6fe3a0}
.s-cancelado{background:rgba(255,91,77,.14);color:#ff8a7f}
.tp{background:var(--card2);color:var(--ink)}
.ag{background:rgba(160,100,255,.18);color:#c9a6ff}
.ocli{margin-top:8px;font-size:.92rem}
.ocli a{color:#7dc6ff;font-weight:600;text-decoration:none}
.oit{background:var(--bg2);border-radius:12px;padding:9px 11px;margin-top:10px;font-size:.88rem}
.oit .o{color:var(--muted);font-size:.8rem;padding-left:16px}
.oact{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.oact .btn{flex:1 1 100%;padding:12px}
.empty{text-align:center;color:var(--muted);padding:44px 10px;font-size:.92rem}
.secT{display:flex;align-items:center;gap:10px;margin:24px 0 6px}
.secT h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);flex:1}
.catbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}
.cath{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px;background:var(--card2)}
.cath input{flex:1;background:transparent;border:0;font-weight:700;font-size:1rem;padding:6px 0;outline:none;min-width:0}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:active{background:rgba(255,255,255,.06)}
.pr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.pr .ph{width:48px;height:48px;border-radius:11px;flex:none}
.pr .tx{flex:1;min-width:0}
.pr b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr small{color:var(--muted);font-size:.8rem}
.pr.off .tx{opacity:.5}
.addp{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line);color:var(--brand);font-weight:700;font-size:.9rem}
.grpE{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.orow{display:grid;grid-template-columns:1fr 92px 34px;gap:6px;margin-top:6px}
.orow .i,.mini3 .i{padding:10px;font-size:15px}
.mini3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .tx{flex:1}
.setrow small{display:block;color:var(--muted);font-size:.78rem}
.hr{display:grid;grid-template-columns:auto 64px minmax(0,1fr);gap:8px;align-items:center;padding:7px 0}
.hr .tm{display:flex;gap:6px;min-width:0}.hr .tm .i{flex:1;min-width:0;width:100%}
.hr span{font-size:.86rem;font-weight:600}
.hr .i{padding:9px;font-size:15px}
.hr.off .i{opacity:.35}
.cores{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cor{width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.cor.on{border-color:#fff}
.upl{display:flex;align-items:center;gap:12px}
.upl .ph,.upl .lg{width:72px;height:72px;border-radius:16px;overflow:hidden;background:var(--card2);flex:none;display:grid;place-items:center;font-weight:800;font-size:1.5rem}
.upl .lg img{width:100%;height:100%;object-fit:cover}
.savebar{position:fixed;left:0;right:0;bottom:62px;z-index:19;padding:10px 16px;transform:translateY(160%);transition:transform .25s;pointer-events:none}
.savebar.show{transform:none;pointer-events:auto}
.savebar .btn{max-width:568px;margin:0 auto;display:flex;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.k small{display:block;color:var(--muted);font-size:.75rem;font-weight:600}
.k b{font-size:1.3rem;display:block;margin-top:2px}
.k span{color:var(--muted);font-size:.76rem}
.barra{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;background:var(--brand);border-radius:99px}
.cli{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.cli:first-child{border-top:0}
.cli .tx{flex:1;min-width:0}
.cli small{display:block;color:var(--muted);font-size:.78rem}
.wa{background:#1fa855;color:#fff;font-weight:700;font-size:.8rem;padding:8px 11px;border-radius:10px;text-decoration:none;flex:none}
.cupom{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.cupom:first-child{border-top:0}
.cupom .tx{flex:1}
.cupom b{font-family:ui-monospace,monospace;letter-spacing:.04em}
.cupom small{display:block;color:var(--muted);font-size:.8rem}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gbox{width:100%;max-width:420px}
.gbox h1{font-size:1.5rem;font-weight:800}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sg{padding:14px 10px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.sg .ph{width:46px;height:46px;border-radius:12px}
.sg.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card))}
.pin{letter-spacing:.5em;text-align:center;font-size:1.5rem;font-weight:800}
.qr{background:#fff;padding:12px;border-radius:14px;width:fit-content;margin-top:10px}
.linkbox{display:flex;gap:8px;margin-top:6px}
.linkbox .i{font-size:14px}
.hint{color:var(--muted);font-size:.78rem;margin-top:5px}
.manitem{display:grid;grid-template-columns:1fr 64px 34px;gap:6px;margin-top:6px}
</style>
</head>
<body>
<div id="root"></div>
<div class="sheet" id="shEd"><div class="panel tall" id="pnEd"></div></div>
<div class="sheet" id="shMan"><div class="panel tall" id="pnMan"></div></div>
<div class="sheet" id="shSt"><div class="panel" id="pnSt"></div></div>
<div class="sheet" id="shAsk" style="align-items:center;padding:20px"><div class="panel" style="border-radius:20px;max-width:380px" id="pnAsk"></div></div>
<div class="savebar" id="savebar"><button class="btn" id="saveBtn">Salvar alterações</button></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" class="hidden">
<input type="file" id="bkIn" accept="application/json,.json" class="hidden">

<script src="config.js"></script>
<script src="art.js"></script>
<script src="store.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const clone = (o) => JSON.parse(JSON.stringify(o));
let D = null, tab = "pedidos", filtro = "ativos", periodo = "hoje";
let F = null;           // cópia de trabalho do formulário da loja
let sujo = false;
let seen = new Set(), audio = null;
const SKEY = "painel_ok_" + Store.id;

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), 2800); }
function abrir(id) { $("#" + id).classList.add("open"); document.body.style.overflow = "hidden"; }
function fechar(id) { $("#" + id).classList.remove("open"); if (!document.querySelector(".sheet.open")) document.body.style.overflow = ""; }
document.querySelectorAll(".sheet").forEach((s) => s.addEventListener("click", (e) => { if (e.target === s) fechar(s.id); }));
document.addEventListener("click", (e) => { const x = e.target.closest("[data-x]"); if (x) fechar(x.dataset.x); });
const ICO = {
  up: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>',
  del: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  edit: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'
};
function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5, .9, 1.15, 1.4].forEach((d, i) => {
      const o = audio.createOscillator(), g = audio.createGain(); o.type = "triangle"; o.frequency.value = i % 3 === 1 ? 1175 : 880;
      g.gain.setValueAtTime(.0001, audio.currentTime + d); g.gain.exponentialRampToValueAtTime(.35, audio.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d + .2);
      o.connect(g).connect(audio.destination); o.start(audio.currentTime + d); o.stop(audio.currentTime + d + .22);
    });
    if (navigator.vibrate) navigator.vibrate([250, 100, 250]);
  } catch (e) {}
}
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return "agora"; if (m < 60) return `há ${m} min`; const h = Math.floor(m / 60); if (h < 24) return `há ${h}h`; return new Date(t).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " " + new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); };
function comprimir(file, max = 700, q = .78) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", q)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}
function pegarImagem(max) { return new Promise((res) => { const f = $("#fileIn"); f.value = ""; f.onchange = async () => { if (!f.files[0]) return res(null); try { res(await comprimir(f.files[0], max)); } catch (e) { toast("Não consegui abrir essa imagem"); res(null); } }; f.click(); }); }

function confirmar(msg, sim = "Confirmar") {
  return new Promise((res) => {
    $("#pnAsk").innerHTML = `<div class="pbody" style="padding-top:20px"><p style="font-size:1.02rem;font-weight:600">${esc(msg)}</p>
      <div style="display:flex;gap:8px;margin-top:18px"><button class="btn ghost" style="flex:1" id="askN">Voltar</button><button class="btn" style="flex:1;background:var(--bad)" id="askS">${esc(sim)}</button></div></div>`;
    const fim = (v) => { fechar("shAsk"); res(v); };
    $("#askN").onclick = () => fim(false); $("#askS").onclick = () => fim(true); abrir("shAsk");
  });
}
function pedirTexto(titulo, ph = "", ok = "Criar") {
  return new Promise((res) => {
    $("#pnAsk").innerHTML = `<div class="pbody" style="padding-top:20px"><p style="font-size:1.02rem;font-weight:700">${esc(titulo)}</p><input class="i" id="askT" placeholder="${esc(ph)}" style="margin-top:12px">
      <div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" style="flex:1" id="askN">Voltar</button><button class="btn" style="flex:1" id="askS">${esc(ok)}</button></div></div>`;
    const fim = (v) => { fechar("shAsk"); res(v); };
    $("#askN").onclick = () => fim(null); $("#askS").onclick = () => fim($("#askT").value);
    $("#askT").addEventListener("keydown", (e) => { if (e.key === "Enter") fim($("#askT").value); });
    abrir("shAsk"); setTimeout(() => $("#askT").focus(), 120);
  });
}

const PRO = () => (window.APP_CONFIG && window.APP_CONFIG.plano) !== "essencial";
const bloqueio = (o) => `<div class="card" style="text-align:center;padding:22px"><b>🔒 ${o}</b><p class="muted" style="margin-top:6px;font-size:.88rem">Disponível no plano Pro. Fale com o suporte pra liberar.</p></div>`;

// ================= ENTRADA =================
let t0 = Date.now(), ultUser = undefined;
function inicio() {
  D = Store.get();
  if (Store.nuvem) {
    ultUser = Store.usuario();
    if (!ultUser) return loginNuvem();
    if (!D) return setup();
    if (!Store.souDono()) return naoDono();
    aplicarCor(D.loja.cor); Store.ouvirPedidos(); t0 = Date.now(); return app();
  }
  if (!D) return setup();
  aplicarCor(D.loja.cor);
  let ok = false; try { ok = sessionStorage.getItem(SKEY) === "1"; } catch (e) {}
  if (!ok) return login();
  app();
}
function setup() {
  let seg = "hamburgueria", cor = Store.MODELOS.hamburgueria.cor;
  const draw = () => {
    $("#root").innerHTML = `<div class="gate"><div class="gbox">
      <h1>Vamos montar seu cardápio</h1><p class="muted" style="margin-top:6px">Leva 1 minuto. Tudo pode ser mudado depois no painel.</p>
      <label class="f">Nome da loja</label><input class="i" id="sNome" placeholder="Ex.: Burger do Zé" value="${esc(window._sn || "")}">
      <label class="f">WhatsApp que vai receber os pedidos</label><input class="i" id="sWa" inputmode="tel" placeholder="(00) 9 0000-0000" value="${esc(window._sw || "")}">
      <label class="f">Tipo de negócio</label>
      <div class="segs">${Object.entries(Store.MODELOS).map(([k, m]) => `<button class="sg ${seg === k ? "on" : ""}" data-seg="${k}"><span class="ph">${ART[m.art] || ART.caixa}</span>${esc(m.nome)}</button>`).join("")}</div>
      <p class="hint">Já vem com um cardápio de exemplo desse tipo pra você só editar.</p>
      <p class="err hidden" id="sErr"></p>
      <button class="btn full" id="sGo" style="margin-top:18px">Criar meu cardápio</button>
      <button class="btn full ghost" id="sImp" style="margin-top:10px">Restaurar de um backup</button>
    </div></div>`;
    document.querySelectorAll("[data-seg]").forEach((b) => b.onclick = () => { window._sn = $("#sNome").value; window._sw = $("#sWa").value; seg = b.dataset.seg; cor = Store.MODELOS[seg].cor; aplicarCor(cor); draw(); });
    $("#sGo").onclick = () => {
      const nome = $("#sNome").value.trim(), wa = soDig($("#sWa").value);
      if (!nome) return erro("Coloque o nome da loja.");
      if (wa.length < 10) return erro("Coloque o WhatsApp com DDD.");
      Store.criar({ nome, segmento: seg, whats: wa, cor });
      try { sessionStorage.setItem(SKEY, "1"); } catch (e) {}
      toast(Store.nuvem ? "Cardápio criado! Agora é só editar." : "Cardápio criado! PIN do painel: 1234 (troque em Loja › Segurança)");
      inicio();
    };
    $("#sImp").onclick = importar;
  };
  const erro = (m) => { $("#sErr").textContent = m; $("#sErr").classList.remove("hidden"); };
  aplicarCor(cor); draw();
}
function loginNuvem() {
  const temDono = Store.lojaTemDono();
  const nome = D ? D.loja.nome : "Painel da loja", lg = D ? Store.img(D.loja.logo) : null;
  if (D) aplicarCor(D.loja.cor);
  $("#root").innerHTML = `<div class="gate"><div class="gbox" style="text-align:center">
    <div class="upl" style="justify-content:center"><div class="lg">${lg ? `<img src="${lg}">` : esc((nome || "?")[0])}</div></div>
    <h1 style="margin-top:14px">${esc(nome)}</h1><p class="muted">${temDono ? "Entre com o e-mail e a senha do dono" : "Crie o acesso do dono da loja"}</p>
    <div style="text-align:left"><label class="f">E-mail</label><input class="i" id="lEm" type="email" autocomplete="username" inputmode="email">
    <label class="f">Senha</label><input class="i" id="lSe" type="password" autocomplete="${temDono ? "current-password" : "new-password"}" placeholder="${temDono ? "" : "Mínimo 6 caracteres"}"></div>
    <p class="err hidden" id="lErr"></p>
    <button class="btn full" id="lGo" style="margin-top:16px">${temDono ? "Entrar" : "Criar acesso e continuar"}</button>
    ${temDono ? `<button class="mini" id="lEsq" style="margin-top:12px">Esqueci a senha</button>` : ""}</div></div>`;
  const err = (m) => { $("#lErr").textContent = m; $("#lErr").classList.remove("hidden"); };
  const traduz = (e) => { const c = (e && e.code) || ""; return c.includes("invalid") || c.includes("wrong-password") || c.includes("user-not-found") ? "E-mail ou senha incorretos." : c.includes("email-already") ? "Esse e-mail já tem conta. Use Entrar." : c.includes("weak-password") ? "A senha precisa ter pelo menos 6 caracteres." : c.includes("too-many") ? "Muitas tentativas. Espere um pouco." : c.includes("network") ? "Sem internet." : "Não deu certo. Tente de novo."; };
  const go = async () => {
    const em = $("#lEm").value.trim(), se = $("#lSe").value;
    if (!/\S+@\S+\.\S+/.test(em)) return err("Coloque um e-mail válido.");
    if (se.length < 6) return err("A senha precisa ter pelo menos 6 caracteres.");
    $("#lGo").disabled = true;
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    try { temDono ? await Store.entrar(em, se) : await Store.criarConta(em, se); } catch (e) { err(traduz(e)); $("#lGo").disabled = false; }
  };
  $("#lGo").onclick = go; $("#lSe").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  if ($("#lEsq")) $("#lEsq").onclick = async () => { const em = $("#lEm").value.trim(); if (!em) return err("Digite seu e-mail primeiro."); try { await Store.resetSenha(em); toast("Enviamos um link pro seu e-mail"); } catch (e) { err(traduz(e)); } };
}
function naoDono() {
  $("#root").innerHTML = `<div class="gate"><div class="gbox" style="text-align:center"><h1>Acesso negado</h1><p class="muted" style="margin-top:8px">Esta conta (${esc(Store.usuario().email)}) não é a dona desta loja.</p><button class="btn full" id="nSair" style="margin-top:18px">Sair e entrar com outra conta</button></div></div>`;
  $("#nSair").onclick = () => Store.sair();
}
function login() {
  $("#root").innerHTML = `<div class="gate"><div class="gbox" style="text-align:center">

// ================= PEDIDOS =================
const STT = { novo: "Novo", preparo: "Em preparo", saiu: "Saiu p/ entrega", pronto: "Pronto p/ retirar", entregue: "Finalizado", cancelado: "Cancelado" };
const TIPO = { entrega: "🛵 Entrega", retirada: "🏪 Retirada", local: "🍽️ No local" };
function proximo(p) {
  if (p.status === "novo") return ["preparo", "Aceitar e preparar"];
  if (p.status === "preparo") return p.tipo === "entrega" ? ["saiu", "Saiu para entrega"] : ["pronto", "Pronto pra retirar"];
  if (p.status === "saiu" || p.status === "pronto") return ["entregue", "Finalizar pedido ✓"];
  return null;
}
function renderPedidos() {
  const all = Store.pedidos();
  const ativos = all.filter((p) => ["novo", "preparo", "saiu", "pronto"].includes(p.status));
  const list = filtro === "ativos" ? ativos : filtro === "fin" ? all.filter((p) => ["entregue", "cancelado"].includes(p.status)).slice(0, 60) : all.slice(0, 80);
  $("#main").innerHTML = `
    <div class="chips"><button class="chip ${filtro === "ativos" ? "on" : ""}" data-f="ativos">Em andamento<em>${ativos.length}</em></button>
      <button class="chip ${filtro === "fin" ? "on" : ""}" data-f="fin">Finalizados</button><button class="chip ${filtro === "todos" ? "on" : ""}" data-f="todos">Todos</button></div>
    <button class="btn full ghost" id="novoMan" style="margin-top:10px">+ Lançar pedido manual (balcão / telefone)</button>
    ${list.length ? list.map(cardPedido).join("") : `<div class="empty">${filtro === "ativos" ? "Nenhum pedido em andamento.<br>Quando chegar um, toca um alarme aqui 🔔<br><br><small>Deixe esta tela aberta no celular ou computador da loja.</small>" : "Nada por aqui ainda."}</div>`}`;
  document.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { filtro = b.dataset.f; renderPedidos(); });
  $("#novoMan").onclick = pedidoManual;
  document.querySelectorAll("[data-st]").forEach((b) => b.onclick = () => mudarStatus(b.dataset.st, b.dataset.to));
  document.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = async () => { if (await confirmar("Cancelar este pedido?", "Cancelar pedido")) mudarStatus(b.dataset.cancel, "cancelado"); });
  document.querySelectorAll("[data-print]").forEach((b) => b.onclick = () => imprimir(b.dataset.print));
}
function msgStatusLink(p, st) {
  const tpl = (D.loja.msgStatus || {})[st]; if (!tpl || !p.whats) return "";
  return `https://wa.me/${waNum(p.whats)}?text=${encodeURIComponent(preencher(tpl, { ...p, loja: D.loja.nome }))}`;
}
function mudarStatus(id, st) {
  Store.updPedido(id, { status: st, ["t_" + st]: Date.now() });

  toast(`Pedido #${p.num}: ${STT[st]}${link ? " · toque em Avisar cliente" : ""}`);
}

    <div class="oit">${p.itens.map((i) => `<div class="line" style="padding:2px 0"><span><b>${i.qtd}x</b> ${esc(i.nome)}</span><span>${brl(i.unit * i.qtd)}</span></div>${i.opcoes && i.opcoes.length ? `<div class="o">${esc(i.opcoes.join(", "))}</div>` : ""}${i.obs ? `<div class="o" style="color:#ffcc66">Obs: ${esc(i.obs)}</div>` : ""}`).join("")}
      <div class="line" style="border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-size:.84rem"><span>${p.desconto ? `Desconto ${esc(p.cupom || "")} −${brl(p.desconto)} · ` : ""}${p.taxa ? `Entrega ${brl(p.taxa)}` : ""}</span></div>
      <div class="line" style="font-weight:800"><span>${esc(p.pag)}${p.troco ? ` · troco p/ ${brl(p.troco)}` : ""}</span><span>${brl(p.total)}</span></div></div>
    <div class="oact">
      ${nx ? `<button class="btn" data-st="${p.id}" data-to="${nx[0]}">${nx[1]}</button>` : ""}
      ${wlink ? `<a class="mini" href="${wlink}" target="_blank" rel="noopener" style="color:#6fe3a0">💬 Avisar cliente</a>` : ""}
      ${mapa ? `<a class="mini" href="${mapa}" target="_blank" rel="noopener">📍 Mapa</a>` : ""}
      <button class="mini" data-print="${p.id}">🖨️ Imprimir</button>
      ${["novo", "preparo"].includes(p.status) ? `<button class="mini red" data-cancel="${p.id}">Cancelar</button>` : ""}
    </div></div>`;
}

    <script>window.onload=()=>{window.print()}<\/script></body></html>`);
  w.document.close();
}
function pedidoManual() {
  const L = D.loja; let itens = [{ pid: "", qtd: 1 }];

    const sel = (it, i) => `<div class="manitem"><select class="i" data-mi="${i}"><option value="">Escolha o item</option>${D.categorias.map((c) => `<optgroup label="${esc(c.nome)}">${D.produtos.filter((p) => p.cat === c.id).map((p) => `<option value="${p.id}" ${it.pid === p.id ? "selected" : ""}>${esc(p.nome)} · ${brl(p.preco)}</option>`).join("")}</optgroup>`).join("")}</select>
      <input class="i" type="number" min="1" value="${it.qtd}" data-mq="${i}"><button class="ib" data-mr="${i}">${ICO.del}</button></div>`;
    $("#pnMan").innerHTML = `<div class="phead"><button class="x" data-x="shMan">←</button><h3>Pedido manual</h3></div><div class="pbody">
      <label class="f">Itens</label>${itens.map(sel).join("")}<button class="mini" id="mAdd" style="margin-top:8px">+ item</button>
      <label class="f">Nome do cliente</label><input class="i" id="mNome" value="${esc(window._mn || "")}" placeholder="Ex.: João">
      <label class="f">WhatsApp (opcional)</label><input class="i" id="mWa" inputmode="tel">
      <label class="f">Tipo</label><select class="i" id="mTipo"><option value="retirada">Retirada</option><option value="entrega">Entrega</option><option value="local">No local</option></select>
      <div id="mEndB" class="hidden"><label class="f">Endereço</label><input class="i" id="mEnd" placeholder="Rua e número"><label class="f">Bairro</label><input class="i" id="mBairro"><label class="f">Taxa de entrega</label><input class="i" id="mTaxa" inputmode="decimal" value="0"></div>
      <label class="f">Pagamento</label><select class="i" id="mPag"><option>Pix</option><option>Dinheiro</option><option>Cartão na entrega</option></select>
      <div class="card" id="mTot"></div><p class="err hidden" id="mErr"></p></div>
      <div class="pfoot"><button class="btn full" id="mGo">Lançar pedido</button></div>`;
    const tot = () => { const s = itens.reduce((a, it) => { const p = D.produtos.find((x) => x.id === it.pid); return a + (p ? p.preco * it.qtd : 0); }, 0); const tx = $("#mTipo").value === "entrega" ? num($("#mTaxa").value) : 0; $("#mTot").innerHTML = `<div class="line tot" style="border:0;margin:0;padding:0"><span>Total</span><span>${brl(s + tx)}</span></div>`; return [s, tx]; };
    $("#pnMan").querySelectorAll("[data-mi]").forEach((s) => s.onchange = () => { itens[+s.dataset.mi].pid = s.value; tot(); });
    $("#pnMan").querySelectorAll("[data-mq]").forEach((s) => s.oninput = () => { itens[+s.dataset.mq].qtd = Math.max(1, +s.value || 1); tot(); });
    $("#pnMan").querySelectorAll("[data-mr]").forEach((b) => b.onclick = () => { itens.splice(+b.dataset.mr, 1); if (!itens.length) itens.push({ pid: "", qtd: 1 }); draw(); });
    $("#mAdd").onclick = () => { window._mn = $("#mNome").value; itens.push({ pid: "", qtd: 1 }); draw(); };
    $("#mTipo").onchange = () => { $("#mEndB").classList.toggle("hidden", $("#mTipo").value !== "entrega"); tot(); };
    $("#mTaxa").oninput = tot; tot();
    $("#mGo").onclick = () => {
      const ok = itens.filter((it) => it.pid); if (!ok.length) { $("#mErr").textContent = "Escolha pelo menos um item."; $("#mErr").classList.remove("hidden"); return; }
      const [s, tx] = tot();
      Store.addPedido({ origem: "manual", nome: $("#mNome").value.trim() || "Cliente balcão", whats: soDig($("#mWa").value), tipo: $("#mTipo").value, end: $("#mEnd").value, bairro: $("#mBairro").value, ref: "", pag: $("#mPag").value, troco: "",
        itens: ok.map((it) => { const p = D.produtos.find((x) => x.id === it.pid); return { nome: p.nome, qtd: it.qtd, unit: p.preco, opcoes: [], obs: "" }; }), subtotal: s, desconto: 0, taxa: tx, total: s + tx });
      window._mn = ""; fechar("shMan"); filtro = "ativos"; toast("Pedido lançado");
    };
  };
  draw(); abrir("shMan");
}

function editarProduto(id, catId) {

  const draw = () => {
    const outros = D.produtos.filter((p) => p.id !== P.id && (p.grupos || []).length);
    $("#pnEd").innerHTML = `<div class="phead"><button class="x" data-x="shEd">←</button><h3>${orig ? "Editar produto" : "Novo produto"}</h3></div>
    <div class="pbody">
      <div class="upl" style="margin-top:14px"><div class="ph" style="width:84px;height:84px;border-radius:16px">${fotoProduto(P)}</div>

        <div><label class="f">Categoria</label><select class="i" data-p="cat">${D.categorias.map((c) => `<option value="${c.id}" ${P.cat === c.id ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}</select></div></div>
      <label class="f">Etiqueta (opcional)</label><input class="i" data-p="tag" value="${esc(P.tag)}" placeholder="Ex.: Mais vendido, Novo, Promoção" maxlength="18">

      <div class="secT"><h2>Opções do produto</h2></div>
      <p class="hint">Ex.: ponto da carne, tamanho, sabores, adicionais pagos, retirar ingredientes. Preço da opção é somado ao produto.</p>
      ${P.grupos.map((g, gi) => `<div class="grpE">
        <div style="display:flex;gap:6px;align-items:center"><input class="i" data-g="${gi}" data-gk="nome" value="${esc(g.nome)}" placeholder="Nome do grupo" style="font-weight:700">
          <button class="ib" data-gu="${gi}">${ICO.up}</button><button class="ib" data-gx="${gi}">${ICO.del}</button></div>
        <div class="mini3" style="margin-top:8px"><div><label class="f" style="margin-top:0">Mínimo</label><input class="i" type="number" min="0" data-g="${gi}" data-gk="min" value="${g.min}"></div>
          <div><label class="f" style="margin-top:0">Máximo</label><input class="i" type="number" min="1" data-g="${gi}" data-gk="max" value="${g.max}"></div>
          <div><label class="f" style="margin-top:0">Preço</label><select class="i" data-g="${gi}" data-gk="regra"><option value="soma" ${g.regra !== "maior" ? "selected" : ""}>Soma tudo</option><option value="maior" ${g.regra === "maior" ? "selected" : ""}>Cobra o maior</option></select></div></div>
        <p class="hint">${g.min > 0 ? "Obrigatório" : "Opcional"} · cliente escolhe ${g.min > 0 ? `de ${g.min} a ` : "até "}${g.max}. "Cobra o maior" serve pra pizza meio a meio.</p>
        ${g.opcoes.map((o, oi) => `<div class="orow"><input class="i" data-o="${gi}.${oi}" data-ok="nome" value="${esc(o.nome)}" placeholder="Opção"><input class="i" data-o="${gi}.${oi}" data-ok="preco" inputmode="decimal" value="${o.preco ? String(o.preco).replace(".", ",") : ""}" placeholder="+ R$ 0"><button class="ib" data-ox="${gi}.${oi}">${ICO.del}</button></div>`).join("")}
        <button class="mini" data-oa="${gi}" style="margin-top:8px">+ opção</button></div>`).join("")}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="mini" id="gNovo">+ Novo grupo de opções</button>
        ${outros.length ? `<select class="i" id="gCopia" style="flex:1;min-width:180px;padding:9px 34px 9px 10px;font-size:14px"><option value="">Copiar opções de outro produto…</option>${outros.map((o) => `<option value="${o.id}">${esc(o.nome)}</option>`).join("")}</select>` : ""}</div>
      <p class="err hidden" id="eErr"></p>
      ${orig ? `<div style="display:flex;gap:8px;margin-top:22px"><button class="mini" id="eDup">Duplicar produto</button><button class="mini red" id="eDel">Excluir produto</button></div>` : ""}
    </div>
    <div class="pfoot"><button class="btn full" id="eSalvar">Salvar produto</button></div>`;
    const pn = $("#pnEd");
    pn.querySelectorAll("[data-p]").forEach((i) => i.oninput = i.onchange = () => { P[i.dataset.p] = i.dataset.p === "preco" ? num(i.value) : i.value; });
    pn.querySelectorAll("[data-gk]").forEach((i) => i.onchange = () => { const g = P.grupos[+i.dataset.g]; const k = i.dataset.gk; g[k] = k === "min" || k === "max" ? Math.max(k === "max" ? 1 : 0, parseInt(i.value) || 0) : i.value; if (k !== "nome") draw(); });
    pn.querySelectorAll("[data-ok]").forEach((i) => i.oninput = () => { const [gi, oi] = i.dataset.o.split(".").map(Number); P.grupos[gi].opcoes[oi][i.dataset.ok] = i.dataset.ok === "preco" ? num(i.value) : i.value; });
    pn.querySelectorAll("[data-ox]").forEach((b) => b.onclick = () => { const [gi, oi] = b.dataset.ox.split(".").map(Number); P.grupos[gi].opcoes.splice(oi, 1); draw(); });
    pn.querySelectorAll("[data-oa]").forEach((b) => b.onclick = () => { P.grupos[+b.dataset.oa].opcoes.push({ nome: "", preco: 0 }); draw(); const ins = pn.querySelectorAll(`[data-o^="${b.dataset.oa}."][data-ok="nome"]`); ins[ins.length - 1].focus(); });
    pn.querySelectorAll("[data-gx]").forEach((b) => b.onclick = async () => { if (await confirmar("Apagar este grupo de opções?", "Apagar")) { P.grupos.splice(+b.dataset.gx, 1); draw(); } });
    pn.querySelectorAll("[data-gu]").forEach((b) => b.onclick = () => { const i = +b.dataset.gu; if (i > 0) { [P.grupos[i - 1], P.grupos[i]] = [P.grupos[i], P.grupos[i - 1]]; draw(); } });
    $("#gNovo").onclick = () => { P.grupos.push({ id: Store.uid(), nome: "", min: 0, max: 1, regra: "soma", opcoes: [{ nome: "", preco: 0 }] }); draw(); };
    if ($("#gCopia")) $("#gCopia").onchange = (e) => { const o = D.produtos.find((x) => x.id === e.target.value); if (!o) return; o.grupos.forEach((g) => P.grupos.push({ ...clone(g), id: Store.uid() })); toast("Opções copiadas"); draw(); };
    $("#eAtivo").onclick = () => { P.ativo = !P.ativo; $("#eAtivo").classList.toggle("on", P.ativo); };
    $("#eFoto").onclick = async () => { const img = await pegarImagem(700); if (img) { P.foto = img; draw(); } };
    if ($("#eSemFoto")) $("#eSemFoto").onclick = () => { P.foto = null; draw(); };
    if ($("#eArt")) $("#eArt").onchange = (e) => { P.art = e.target.value; draw(); };
    $("#eSalvar").onclick = () => {
      const er = (m) => { $("#eErr").textContent = m; $("#eErr").classList.remove("hidden"); $("#eErr").scrollIntoView({ block: "center" }); };
      if (!P.nome.trim()) return er("Coloque o nome do produto.");
      if (!P.cat) return er("Crie uma categoria primeiro.");
      for (const g of P.grupos) {
        g.opcoes = g.opcoes.filter((o) => o.nome.trim());
        if (!g.nome.trim()) return er("Todo grupo de opções precisa de nome.");
        if (!g.opcoes.length) return er(`O grupo "${g.nome}" não tem opções.`);
        g.max = Math.min(Math.max(1, g.max), g.opcoes.length); g.min = Math.min(g.min, g.max);
      }
      P.nome = P.nome.trim(); P.preco = num(P.preco);
      D = Store.get(); const i = D.produtos.findIndex((x) => x.id === P.id);
      if (i >= 0) D.produtos[i] = P; else D.produtos.push(P);
      if (Store.save(D)) { fechar("shEd"); toast("Produto salvo"); renderCardapio(); }
    };
    if ($("#eDup")) $("#eDup").onclick = () => { D = Store.get(); const c = { ...clone(orig), id: Store.uid(), nome: orig.nome + " (cópia)", grupos: orig.grupos.map((g) => ({ ...clone(g), id: Store.uid() })) }; D.produtos.splice(D.produtos.findIndex((x) => x.id === orig.id) + 1, 0, c); Store.save(D); fechar("shEd"); toast("Produto duplicado"); renderCardapio(); editarProduto(c.id); };
    if ($("#eDel")) $("#eDel").onclick = async () => { if (!(await confirmar("Excluir este produto?", "Excluir"))) return; D = Store.get(); D.produtos = D.produtos.filter((x) => x.id !== orig.id); Store.save(D); fechar("shEd"); toast("Produto excluído"); renderCardapio(); };
  };
  draw(); abrir("shEd"); $("#pnEd").scrollTop = 0;
}

// ================= LOJA =================
function getP(o, p) { return p.split(".").reduce((a, k) => a == null ? a : a[k], o); }
function setP(o, p, v) { const ks = p.split("."); const l = ks.pop(); ks.reduce((a, k) => a[k] = a[k] || {}, o)[l] = v; }
function mostrarSave(v) { $("#savebar").classList.toggle("show", v); }
function marcar() { sujo = true; mostrarSave(true); }
$("#saveBtn").onclick = () => {
  if (!F) return;
  if (soDig(F.whats).length < 10) return toast("WhatsApp da loja inválido");
  if (!Store.nuvem && !/^\d{4,6}$/.test(String(F.pin))) return toast("O PIN precisa ter de 4 a 6 números");
  F.taxas = F.taxas.filter((t) => t.bairro.trim());
  const d = Store.get(); d.loja = clone(F);
  if (Store.save(d)) { D = d; sujo = false; mostrarSave(false); aplicarCor(F.cor); renderTopo(); toast("Alterações salvas ✓"); renderLoja(); }
};

  if ($("#lSemLogo")) $("#lSemLogo").onclick = () => { F.logo = null; marcar(); renderLoja(); };
  $("#sair").onclick = () => { try { sessionStorage.removeItem(SKEY); } catch (e) {} if (Store.nuvem) Store.sair(); else location.reload(); };
  if ($("#trocaSenha")) $("#trocaSenha").onclick = async () => { const n = await pedirTexto("Nova senha (mínimo 6 caracteres)", "", "Trocar"); if (!n) return; if (n.length < 6) return toast("Senha muito curta"); try { await Store.trocarSenha(n); toast("Senha trocada"); } catch (e) { toast("Saia e entre de novo antes de trocar a senha"); } };
  if ($("#lCapa")) $("#lCapa").onclick = async () => { const img = await pegarImagem(1000); if (img) { F.capa = img; marcar(); renderLoja(); } };
  if ($("#lSemCapa")) $("#lSemCapa").onclick = () => { F.capa = null; marcar(); renderLoja(); };
  if ($("#slAdd")) $("#slAdd").onclick = () => { F.slides = F.slides || []; F.slides.push({ img: null, titulo: "", texto: "", pid: "" }); marcar(); renderLoja(); };
  m.querySelectorAll("[data-slimg]").forEach((b) => b.onclick = async () => { const img = await pegarImagem(1000); if (img) { F.slides[+b.dataset.slimg].img = img; marcar(); renderLoja(); } });
  m.querySelectorAll("[data-sldel]").forEach((b) => b.onclick = () => { F.slides.splice(+b.dataset.sldel, 1); marcar(); renderLoja(); });
  m.querySelectorAll("[data-slup]").forEach((b) => b.onclick = () => { const i = +b.dataset.slup; if (i > 0) { [F.slides[i - 1], F.slides[i]] = [F.slides[i], F.slides[i - 1]]; marcar(); renderLoja(); } });
  m.querySelectorAll("[data-sl]").forEach((i) => i.oninput = i.onchange = () => { const [x, k] = i.dataset.sl.split("."); F.slides[+x][k] = i.value; marcar(); });
  $("#cpy").onclick = async () => { try { await navigator.clipboard.writeText(link); toast("Link copiado"); } catch (e) { $("#lnk").select(); toast("Selecione e copie o link"); } };
  try { if (window.QRCode) new QRCode($("#qr"), { text: link, width: 150, height: 150 }); else $("#qr").classList.add("hidden"); } catch (e) { $("#qr").classList.add("hidden"); }
  $("#bkExp").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([Store.exportar()], { type: "application/json" })); a.download = `backup-${(D.loja.nome || "loja").toLowerCase().replace(/\W+/g, "-")}-${new Date().toISOString().slice(0, 10)}.json`; a.click(); toast("Backup baixado"); };
  $("#bkImp").onclick = importar;
  $("#limpaPed").onclick = async () => { if (await confirmar("Apagar todos os pedidos? O cardápio continua.", "Apagar pedidos")) { Store.limparPedidos(); toast("Pedidos apagados"); } };
  $("#zerar").onclick = async () => { if (await confirmar("Apagar TUDO (cardápio, configurações e pedidos) e começar do zero? Não dá pra desfazer.", "Apagar tudo")) { Store.apagarTudo(); try { sessionStorage.removeItem(SKEY); } catch (e) {} location.reload(); } };
}
function importar() {
  const f = $("#bkIn"); f.value = ""; f.onchange = () => { const r = new FileReader(); r.onload = () => { try { Store.importar(r.result); toast("Backup restaurado"); try { sessionStorage.setItem(SKEY, "1"); } catch (e) {} F = null; inicio(); } catch (e) { toast("Arquivo de backup inválido"); } }; r.readAsText(f.files[0]); }; f.click();
}

// ================= CUPONS =================
function renderCupons() {
  D = Store.get();
  if (!PRO()) { $("#main").innerHTML = `<div class="secT"><h2>Cupons de desconto</h2></div>${bloqueio("Cupons de desconto")}`; return; }
  $("#main").innerHTML = `<div class="secT"><h2>Cupons de desconto</h2></div>
    <div class="card">${D.cupons.length ? D.cupons.map((c, i) => `<div class="cupom"><div class="tx"><b>${esc(c.codigo)}</b><small>${c.tipo === "pct" ? c.valor + "% off" : brl(c.valor) + " off"}${c.minimo ? ` · pedidos a partir de ${brl(c.minimo)}` : ""}</small></div><button class="tg ${c.ativo ? "on" : ""}" data-ca="${i}"></button><button class="ib" data-cdel="${i}">${ICO.del}</button></div>`).join("") : `<p class="muted">Nenhum cupom ainda.</p>`}</div>
    <div class="secT"><h2>Criar cupom</h2></div>
    <div class="card"><label class="f" style="margin-top:0">Código</label><input class="i" id="cCod" placeholder="Ex.: FRETEGRATIS" style="text-transform:uppercase">
      <label class="f">Tipo de desconto</label><div class="seg" id="cTipo"><button class="on" data-ct="pct">Porcentagem</button><button data-ct="valor">Valor em R$</button></div>
      <div class="row2"><div><label class="f" id="cValL">Desconto (%)</label><input class="i" id="cVal" inputmode="decimal"></div><div><label class="f">Pedido mínimo (R$)</label><input class="i" id="cMin" inputmode="decimal" placeholder="0"></div></div>
      <button class="btn full" id="cAdd" style="margin-top:14px">Criar cupom</button></div>
    <p class="hint">Divulgue o código no Instagram ou na faixa de promoção (aba Loja). O cliente digita na sacola.</p>`;
  let tipo = "pct";
  document.querySelectorAll("[data-ct]").forEach((b) => b.onclick = () => { tipo = b.dataset.ct; document.querySelectorAll("[data-ct]").forEach((x) => x.classList.toggle("on", x === b)); $("#cValL").textContent = tipo === "pct" ? "Desconto (%)" : "Desconto (R$)"; });
  document.querySelectorAll("[data-ca]").forEach((b) => b.onclick = () => { D.cupons[+b.dataset.ca].ativo = !D.cupons[+b.dataset.ca].ativo; Store.save(D); renderCupons(); });
  document.querySelectorAll("[data-cdel]").forEach((b) => b.onclick = async () => { if (await confirmar("Apagar este cupom?", "Apagar")) { D.cupons.splice(+b.dataset.cdel, 1); Store.save(D); renderCupons(); } });
  $("#cAdd").onclick = () => {
    const cod = $("#cCod").value.trim().toUpperCase().replace(/\s+/g, ""), val = num($("#cVal").value);
    if (!cod) return toast("Coloque o código"); if (val <= 0) return toast("Coloque o valor do desconto");
    if (tipo === "pct" && val > 100) return toast("Porcentagem máxima é 100");
    if (D.cupons.some((c) => c.codigo === cod)) return toast("Esse código já existe");
    D.cupons.push({ codigo: cod, tipo, valor: val, minimo: num($("#cMin").value), ativo: true }); Store.save(D); toast("Cupom criado"); renderCupons();
  };
}

// ================= RESUMO =================
function renderResumo() {
  const now = new Date();
  const ini = periodo === "hoje" ? new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() : periodo === "7" ? Date.now() - 7 * 864e5 : periodo === "mes" ? new Date(now.getFullYear(), now.getMonth(), 1).getTime() : 0;
  const todos = Store.pedidos().filter((p) => p.criado >= ini);
  const ok = todos.filter((p) => p.status !== "cancelado");
  const fat = ok.reduce((s, p) => s + p.total, 0);
  const top = {}; ok.forEach((p) => p.itens.forEach((i) => { top[i.nome] = top[i.nome] || { q: 0, v: 0 }; top[i.nome].q += i.qtd; top[i.nome].v += i.qtd * i.unit; }));
  const tl = Object.entries(top).sort((a, b) => b[1].q - a[1].q).slice(0, 8), mx = tl.length ? tl[0][1].q : 1;
  const pg = {}; ok.forEach((p) => pg[p.pag] = (pg[p.pag] || 0) + p.total);
  const tp = {}; ok.forEach((p) => tp[p.tipo] = (tp[p.tipo] || 0) + 1);
  const cl = {}; Store.pedidos().filter((p) => p.status !== "cancelado" && p.whats).forEach((p) => { const c = cl[p.whats] = cl[p.whats] || { nome: p.nome, whats: p.whats, n: 0, v: 0, ult: 0 }; c.n++; c.v += p.total; if (p.criado > c.ult) { c.ult = p.criado; c.nome = p.nome; } });
  const cls = Object.values(cl).sort((a, b) => b.v - a.v).slice(0, 30);
  $("#main").innerHTML = `<div class="chips">${[["hoje", "Hoje"], ["7", "7 dias"], ["mes", "Este mês"], ["tudo", "Tudo"]].map(([k, t]) => `<button class="chip ${periodo === k ? "on" : ""}" data-pe="${k}">${t}</button>`).join("")}</div>
    <div class="kp"><div class="k"><small>Faturamento</small><b>${brl(fat)}</b><span>${ok.length} pedido(s)</span></div>
      <div class="k"><small>Ticket médio</small><b>${brl(ok.length ? fat / ok.length : 0)}</b><span>por pedido</span></div>
      <div class="k"><small>Entregas / retiradas</small><b>${tp.entrega || 0} / ${(tp.retirada || 0) + (tp.local || 0)}</b><span>no período</span></div>
      <div class="k"><small>Cancelados</small><b>${todos.length - ok.length}</b><span>no período</span></div></div>
    <div class="secT"><h2>Mais vendidos</h2></div><div class="card">${tl.length ? tl.map(([n, v]) => `<div style="padding:6px 0"><div class="line" style="padding:0"><span>${esc(n)}</span><b>${v.q}</b></div><div class="barra"><i style="width:${(v.q / mx) * 100}%"></i></div></div>`).join("") : `<p class="muted">Sem vendas nesse período.</p>`}</div>
    <div class="secT"><h2>Formas de pagamento</h2></div><div class="card">${Object.keys(pg).length ? Object.entries(pg).map(([n, v]) => `<div class="line"><span>${esc(n)}</span><b>${brl(v)}</b></div>`).join("") : `<p class="muted">—</p>`}</div>
    <div class="secT"><h2>Clientes</h2></div>${!PRO() ? bloqueio("Lista de clientes") : `<div class="card">${cls.length ? cls.map((c) => `<div class="cli"><div class="tx"><b>${esc(c.nome)}</b><small>${c.n} pedido(s) · ${brl(c.v)} · último ${ago(c.ult)}</small></div><a class="wa" href="https://wa.me/${waNum(c.whats)}?text=${encodeURIComponent(`Oi ${c.nome.split(" ")[0]}! Aqui é da ${D.loja.nome} 😄 Bateu a fome? Nosso cardápio: ${location.href.replace(/admin\.html.*$/, "")}`)}" target="_blank" rel="noopener">Chamar</a></div>`).join("") : `<p class="muted">Os clientes aparecem aqui conforme os pedidos chegam.</p>`}</div>`}
    <p class="hint" style="text-align:center;margin-top:20px">Plano ${PRO() ? "Pro" : "Essencial"}</p>`;
  document.querySelectorAll("[data-pe]").forEach((b) => b.onclick = () => { periodo = b.dataset.pe; renderResumo(); });
}

window.addEventListener("beforeunload", (e) => { if (sujo) { e.preventDefault(); e.returnValue = ""; } });
$("#root").innerHTML = `<div class="gate"><p class="muted">Carregando…</p></div>`;
Store.onErro((m) => toast(m));
Store.ready(() => {
  if ((window.APP_CONFIG || {}).demo) window.montarDemo();
  inicio();
  if (Store.nuvem) Store.onChange(() => { const u = Store.usuario(); if (u !== ultUser || (!iniciado && u && Store.get())) { ultUser = u; if (!u) { iniciado = false; } inicio(); } });
});
</script>
</body>
